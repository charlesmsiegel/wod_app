<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%227%22 y=%223%22 width=%2218%22 height=%2226%22 rx=%223%22 fill=%22%23241433%22 stroke=%22%23d6b25e%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22none%22 stroke=%22%23d6b25e%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
  <title>Mage Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:wght@400;600&display=swap">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, #2e1b40, #120b1c 70%);
      color: #ece4f2;
      font-family: "Spectral", Georgia, serif;
      font-size: 18px;
    }
    main { max-width: 720px; margin: 0 auto; padding: 12vh 16px 40px; }
    h1 {
      margin: 0 0 6px;
      font-family: "Cinzel", Georgia, serif;
      font-size: 40px;
      letter-spacing: 0.06em;
      color: #d6b25e;
    }
    .lede { margin: 0 0 32px; color: #a898b8; }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
    a {
      display: block;
      padding: 16px 20px;
      border: 1px solid #3b2a4d;
      border-radius: 10px;
      background: #1a1124;
      color: inherit;
      text-decoration: none;
    }
    a:hover, a:focus-visible { border-color: #d6b25e; outline: none; }
    a strong { display: block; font-family: "Cinzel", Georgia, serif; color: #d6b25e; }
    a span { color: #a898b8; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Mage Tools</h1>
    <p class="lede">Table aids for Mage: The Ascension.</p>
    <ul>
      <li>
        <a href="apps/tarot/">
          <strong>Tarot Reader</strong>
          <span>Deal a Mage Tarot spread and read what each card means.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
