name: Test and publish World of Darkness Tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: JavaScript tests
        run: node --test tests/*.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check apps/names/names-core.js
          node --check apps/names/hermetic-houses.js
          node --check apps/names/names.js
          node --check apps/garou/garou.js
          node --check apps/garou/garou-astro.js
          node --check apps/garou/sky-data.js
          node --check apps/garou/umbral-data.js
      - name: Build static site
        run: python serve.py --build dist
      - name: Assert both apps are bundled
        run: |
          test -f dist/apps/tarot/data.json
          test -f dist/apps/garou/index.html
          test -s dist/apps/garou/vendor/astronomy.browser.min.js
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
